<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>threshold.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--navy:#101C2C;--nl:#263D56;--mb:#7795B1;--pb:#E9EEF3;--bg:#F7F8FA;--w:#fff;--tx:#101C2C;--card:#fff;--sh:0 4px 24px rgba(16,28,44,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1420;--card:#101C2C;--pb:#1a2b3f;--tx:#E9EEF3;--sh:0 4px 24px rgba(0,0,0,.4);color-scheme:dark}}
html{scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;letter-spacing:-.02em}h1{font-size:clamp(2.2rem,6vw,3.6rem)}h2{font-size:1.9rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:12px 20px;border-bottom:1px solid var(--pb);overflow-x:auto}
.logo{font-weight:700;font-size:1.3rem;margin-right:auto;color:var(--tx);text-decoration:none}.logo b{color:var(--mb)}
nav a{white-space:nowrap;text-decoration:none;color:var(--tx);opacity:.7;padding:6px 12px;border-radius:99px;font-size:.9rem;transition:.2s}nav a:hover,nav a.on{background:var(--pb);opacity:1}
main{max-width:960px;margin:0 auto;padding:32px 20px 80px;animation:f .4s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--sh);margin-bottom:18px;transition:.25s}.card:hover{transform:translateY(-2px)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--navy);color:#fff;padding:12px 24px;border-radius:99px;font:inherit;font-weight:600;text-decoration:none;transition:.2s;margin:4px 8px 4px 0}.btn:hover{background:var(--nl);transform:translateY(-1px)}
.btn.o{background:transparent;color:var(--tx);border:1.5px solid var(--mb)}.btn.o:hover{background:var(--pb)}.btn.sm{padding:6px 14px;font-size:.85rem}.btn:disabled{opacity:.4;cursor:not-allowed}
:root[data-theme]:not([data-theme=light]) .btn,@media(prefers-color-scheme:dark){.btn:not(.o){background:var(--mb);color:#101C2C}}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:.9rem}input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--pb);border-radius:12px;font:inherit;background:var(--card);color:var(--tx)}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mb)}input[type=checkbox]{width:auto}
.hero{padding:60px 0 40px;max-width:680px}.muted{color:var(--mb)}.sub{font-size:1.15rem;opacity:.8}
.chip{display:inline-block;padding:8px 16px;margin:4px;border-radius:99px;background:var(--pb);cursor:pointer;border:1.5px solid transparent;transition:.2s;font-size:.9rem;user-select:none}.chip.on{background:var(--navy);color:#fff}.chip.s{cursor:default;font-size:.8rem;padding:4px 12px}
.bar{height:8px;background:var(--pb);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--mb);transition:width .4s}
.opt{padding:14px 18px;margin:10px 0;border:1.5px solid var(--pb);border-radius:14px;cursor:pointer;transition:.2s}.opt:hover{border-color:var(--mb)}.opt.on{background:var(--navy);color:#fff;transform:scale(1.02)}
.tag{font-size:.75rem;background:#fff3cd;color:#664d03;padding:2px 10px;border-radius:99px}
.msgs{height:340px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px}.m{max-width:78%;padding:10px 14px;border-radius:16px;background:var(--pb)}.m.me{align-self:flex-end;background:var(--navy);color:#fff}.m small{display:block;opacity:.6;font-size:.72rem}.m a{font-size:.75rem;cursor:pointer;text-decoration:underline}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pct{font-size:2rem;font-weight:700;color:var(--mb)}.steps{counter-reset:s}.steps .card:before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pb);margin-bottom:8px;font-weight:700}
footer{text-align:center;padding:30px;opacity:.6;font-size:.85rem}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),LANGS=['English','Bengali','Kannada','Hindi','Tamil','Telugu'],COM=['Short messages','Long thoughtful messages','Voice-note style, casual','Slow and steady'],
T=[['The Quiet Observer','You take things in before joining. You value calm, one-to-one connection.'],['The Thoughtful Conversationalist','You love meaningful talks and learning how people think.'],['The Social Explorer','You’re energised by new places, people and plans.'],['The Easygoing Companion','You go with the flow and make others feel relaxed.']],
Q=[['You enter your new college classroom. What do you do?','Find a quiet seat and observe','Smile at whoever sits nearby','Introduce yourself to several people','Sit anywhere, see what happens'],
['Your ideal weekend looks like…','Reading or a quiet hobby','A long coffee and a good chat','Exploring somewhere new','Whatever my friends are doing'],
['What kind of conversation do you enjoy most?','Light and low-pressure','Deep and meaningful','Fun and energetic','Relaxed and random'],
['When someone takes time to reply, you usually…','Assume they’re busy and wait','Send a thoughtful follow-up later','Check in with something fun','Don’t think about it'],
['Your friends would describe you as…','Calm and observant','A great listener','Adventurous','Easy to be around'],
['If you and your buddy disagree, you would…','Take time to think first','Talk it through openly','Suggest doing something together','Let it go and move on'],
['What would make you most excited about college?','Finding my quiet corner','Meeting people who think differently','Discovering the city and events','Simply feeling at home'],
['Which communication style feels comfortable?','Text first, then in person','Long, considered messages','Quick back-and-forth','Casual, whenever'],
['Your ideal buddy is someone who…','Is patient and gentle','Is curious and thoughtful','Is outgoing and spontaneous','Is relaxed and friendly'],
['If your buddy suggests exploring the city, you…','Ask for a quiet spot first','Ask what they want to see','Say yes immediately','Say sure, why not']],
IN=['Music','Movies and series','Gaming','Reading','Art and painting','Photography','Sports','Technology','Coding','Travel','Food','Dance','Fashion','Fitness','Entrepreneurship'],
P=[{id:1,n:'Maple',lang:'Bengali',t:1,i:['Music','Reading','Photography','Travel'],s:.7,l:.8,c:'Northfield College',intro:'Bookworm from Kolkata, learning my way around.',m:['হ্যালো! তুমি কোন ক্লাবে যোগ দিচ্ছ?','Hello! Which club are you joining?']},
{id:2,n:'Juniper',lang:'Kannada',t:0,i:['Gaming','Coding','Technology','Movies and series'],s:.5,l:.6,c:'Northfield College',intro:'Local, happy to show you around.',m:['ನಮಸ್ಕಾರ! ಇಲ್ಲಿ ಕಾಫಿ ಎಲ್ಲಿ ಚೆನ್ನಾಗಿದೆ ಗೊತ್ತಾ?','Hi! Do you know where the coffee is good here?']},
{id:3,n:'Sparrow',lang:'Hindi',t:2,i:['Travel','Food','Dance','Fitness','Music'],s:.9,l:.5,c:'Northfield College',intro:'Always up for a new café.',m:['अरे! इस वीकेंड शहर घूमने चलें?','Hey! Shall we explore the city this weekend?']},
{id:4,n:'Willow',lang:'English',t:3,i:['Art and painting','Photography','Food','Reading'],s:.6,l:.9,c:'Northfield College',intro:'Sketching everything I see.',m:['Hi! Nice to meet you.','Hi! Nice to meet you.']},
{id:5,n:'Cedar',lang:'English',t:2,i:['Music','Sports'],s:.8,l:.7,c:'Elmwood University',intro:'Different college – never matched.',m:['Hi','Hi']}],
S={name:'',college:'',lang:'English',nick:'',comm:COM[0],intro:'',ans:[],res:null,ints:[],buddy:null,prev:[],streak:0,msgs:[],vis:true,blocked:[],reg:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('th')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('th',JSON.stringify(S))}catch(e){}},go=r=>location.hash=r,
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
chips=a=>a.map(x=>`<span class="chip s">${esc(x)}</span>`).join(''),
NAV=[['home','Home'],['dashboard','Dashboard'],['quiz','Quiz'],['interests','Interests'],['match','Matches'],['chat','Chat'],['shield','Shield'],['prefs','Settings']];
let qi=0;
function score(p){const sh=p.i.filter(x=>S.ints.includes(x)),u=new Set([...p.i,...S.ints]).size||1,ii=sh.length/u*2>1?1:sh.length/u*2,
cm=S.res==null?.6:(S.res===p.t?1:(Math.abs(S.res-p.t)==1?.8:.6)),so=1-Math.abs(p.s-(S.res==2?.9:S.res==0?.4:.65)),li=p.l,
pc=Math.round((.3*ii+.3*cm+.2*so+.2*li)*100);return{pc,sh,why:(sh.length?'You both like '+sh.join(', ')+'. ':'Different interests, which can make for fun conversations. ')+(p.lang==S.lang?'You share a preferred language. ':'Translation will help you chat in your own languages. ')+(cm>=.8?'Your communication styles are a close fit.':'')}}
const V={
home:()=>`<section class="hero"><h1>College feels different when you have <span class="muted">someone.</span></h1><p class="sub">Find a buddy who understands your language, shares your interests and makes a new place feel a little more like home.</p><a class="btn" href="#register">Find Your Buddy</a><a class="btn o" href="#how">How It Works</a></section>
<div class="grid"><div class="card"><h3>About threshold.</h3><p>A friendship platform (not a dating site) for students new to a college, a city or a language. <i>${'Find your people, at your pace.'}</i></p></div><div class="card"><h3>Why we exist</h3><p>Starting college can be lonely, especially if you’re shy or don’t speak the local language. We make the first hello gentler.</p></div><div class="card"><h3>Language inclusion</h3><p>Write in the language you’re comfortable in. Your buddy reads it in theirs, and can always see your original. <span class="tag">Prototype: simulated translation</span></p></div></div>
<h2 id="how" style="margin-top:48px">How it works</h2><div class="grid steps"><div class="card"><b>Join with your college code</b><p>Only verified students from your own college are ever matched.</p></div><div class="card"><b>Take the quiz, pick interests</b><p>A friendly preference tool, not a scientific test.</p></div><div class="card"><b>Meet a buddy anonymously</b><p>After 3 active days, basic profiles are revealed (you’re told exactly which fields first).</p></div><div class="card"><b>Meet more people</b><p>After 5 active days you may meet another buddy. No friendship is ever ended.</p></div></div>
<div class="card" style="margin-top:30px"><h3>Threshold Shield</h3><p>Reporting, blocking, automated checks and human moderation. <a href="#shield">See how safety works →</a></p></div>
<div class="card" style="text-align:center"><h2>Join threshold.</h2><a class="btn" href="#register">Get started</a></div>`,
register:()=>`<div class="card" style="max-width:480px;margin:auto"><h2>Join with your college</h2><p class="tag">Simulated verification. Production uses server-side code and email validation.</p>
<form id="f"><label>College invitation code</label><input id="code" placeholder="Try THRESH-2026" required><label>Student name</label><input id="nm" required value="${esc(S.name)}"><label>College email</label><input id="em" type="email" required placeholder="you@northfield.edu"><label>Password</label><input id="pw" type="password" minlength="8" required><label>Preferred language</label><select id="lg">${LANGS.map(l=>`<option ${l==S.lang?'selected':''}>${l}</option>`)}</select><p id="err" style="color:#b3261e"></p><button class="btn">Verify &amp; continue</button></form></div>`,
profile:()=>`<div class="card" style="max-width:560px;margin:auto"><h2>Your profile</h2><p>Anonymous first: only your nickname is shown to a new buddy. Contact details are never shown.</p><form id="f"><label>Nickname</label><input id="nk" required value="${esc(S.nick)}"><label>College</label><input disabled value="${esc(S.college||'Not verified yet')}"><label>Preferred language</label><select id="lg">${LANGS.map(l=>`<option ${l==S.lang?'selected':''}>${l}</option>`)}</select><label>Communication style</label><select id="cm">${COM.map(l=>`<option ${l==S.comm?'selected':''}>${l}</option>`)}</select><label>Short introduction (optional)</label><textarea id="in" rows="3">${esc(S.intro)}</textarea><label><input type="checkbox" id="ag" ${S.nick?'checked':''} required> I confirm I’m 18 or older (or eligible per my college)</label><button class="btn" style="margin-top:14px">Save &amp; take the quiz</button></form></div>`,
quiz:()=>{if(S.res!=null&&qi>=10)return`<div class="card" style="max-width:560px;margin:auto;text-align:center"><p class="muted">Your result</p><h2>${T[S.res][0]}</h2><p>${T[S.res][1]}</p><p style="font-size:.85rem;opacity:.7">This is a preference-discovery tool, not a clinical or validated assessment. No type is better than another.</p><a class="btn" href="#interests">Choose interests</a><button class="btn o" onclick="qi=0;S.ans=[];go('quiz');rt()">Retake</button></div>`;
const q=Q[qi];return`<div class="card" style="max-width:600px;margin:auto"><div class="row" style="justify-content:space-between"><small>Question ${qi+1} of 10</small></div><div class="bar"><i style="width:${(qi+1)*10}%"></i></div><h3>${q[0]}</h3>${q.slice(1).map((o,i)=>`<div class="opt ${S.ans[qi]===i?'on':''}" onclick="S.ans[qi]=${i};rt()">${o}</div>`).join('')}<div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn o" ${qi?'':'disabled'} onclick="qi--;rt()">Back</button><button class="btn" ${S.ans[qi]==null?'disabled':''} onclick="nextQ()">${qi==9?'Finish':'Next'}</button></div></div>`},
interests:()=>`<div class="card"><h2>What are you into?</h2><p>Pick as many as you like. These power your matches.</p>${[...new Set([...IN,...S.ints])].map(x=>`<span class="chip ${S.ints.includes(x)?'on':''}" onclick="tg('${x.replace(/'/g,'’')}')">${esc(x)}</span>`).join('')}<div class="row" style="margin-top:16px"><input id="ci" placeholder="Add your own…" style="max-width:240px"><button class="btn o sm" onclick="addI()">Add</button></div><a class="btn" href="#match" style="margin-top:16px">Find my buddy</a></div>`,
match:()=>{const used=[S.buddy,...S.prev].filter(Boolean),c=P.filter(p=>p.c===(S.college||'Northfield College')&&!used.includes(p.id)&&!S.blocked.includes(p.id)).map(p=>({p,...score(p)})).sort((a,b)=>b.pc-a.pc).filter(x=>x.pc>=40);
return`<h2>Buddy suggestions</h2><p class="tag">Demo pool: same-college students only (a student from another college is excluded by design). Production enforces this on the server.</p>${S.ints.length?'':'<p>Tip: <a href="#interests">pick interests</a> for better matches.</p>'}
${c.length?c.map(x=>`<div class="card row"><div style="flex:1"><h3>${x.p.n} <small class="muted">· prefers ${x.p.lang}</small></h3><p>${x.why}</p>${chips(x.p.i)}</div><div style="text-align:center"><div class="pct">${x.pc}%</div><button class="btn sm" onclick="pick(${x.p.id})">Say hello</button></div></div>`).join(''):`<div class="card"><h3>You’re in the waiting queue</h3><p>No suitable match is available right now. We’ll notify you when someone from your college fits.</p></div>`}`},
chat:()=>{const b=P.find(p=>p.id===S.buddy);if(!b)return`<div class="card"><h3>No active chat</h3><a class="btn" href="#match">Find a buddy</a></div>`;
const rv=S.streak>=3;return`<div class="card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${rv?b.n:'Anonymous buddy'} <small class="muted">· prefers ${b.lang}</small></h3><small>● Connected (demo) · Day ${S.streak} of active conversation</small></div><div><button class="btn o sm" onclick="rep()">Report</button><button class="btn o sm" onclick="blk(${b.id})">Block</button></div></div>
<div class="msgs" id="ms"><div class="m"><small>10:02 · ${b.lang} original</small><span data-o="${esc(b.m[0])}" data-t="${esc(b.m[1])}">${esc(b.m[1])}</span><small>Translated to English (simulated preview)</small><a onclick="tr(this)">Show original</a></div>${S.msgs.map(m=>`<div class="m me"><small>${m.t}</small>${esc(m.x)}</div>`).join('')}</div>
<form id="cf" class="row"><input id="ct" placeholder="Write in ${S.lang}…" style="flex:1" autocomplete="off"><button class="btn">Send</button></form><p style="font-size:.8rem;opacity:.7">Translation here is a labelled simulation. Production calls a translation API through a secure backend.</p>
<button class="btn o sm" onclick="day()">Simulate next active day</button> ${S.streak>=3?'<a class="btn o sm" href="#reveal">Profile reveal</a>':''} ${S.streak>=5?'<a class="btn o sm" href="#rotation">Rotation offer</a>':''}</div>`},
reveal:()=>{const b=P.find(p=>p.id===S.buddy);return`<div class="card"><h2>Profile reveal</h2><p><b>Notice (shown before matching):</b> after 3 consecutive active conversation days, your buddy will see your <b>nickname, college, interests and short introduction</b>. We never reveal phone numbers, addresses, passwords, private contact details or sensitive information. You can block or report at any time.</p><div class="bar"><i style="width:${Math.min(100,S.streak/3*100)}%"></i></div><p>${Math.min(S.streak,3)} of 3 days</p>${S.streak>=3&&b?`<div class="card" style="background:var(--pb)"><h3>${b.n} is now visible</h3><p>${b.c}</p><p>${b.intro}</p>${chips(b.i)}</div>`:'<p>Not revealed yet. No need to message every day: breaks are fine, they just pause progress.</p>'}</div>`},
rotation:()=>`<div class="card"><h2>Meet another buddy?</h2>${S.streak>=5?`<p>You’ve had 5 active days. If you’d like, meet someone new. Your current conversation stays, and you can keep chatting with every buddy.</p><button class="btn" onclick="rot()">Meet a new buddy</button><a class="btn o" href="#chat">Stay with current buddy</a>`:`<p>Unlocks after 5 consecutive active days (you’re at ${S.streak}). It’s optional, an extra opportunity and never a replacement. No pressure to message just to keep a streak.</p>`}</div>`,
dashboard:()=>{const b=P.find(p=>p.id===S.buddy),sc=b&&score(b);return`<h2>Welcome${S.nick||S.name?', '+esc(S.nick||S.name):''}</h2><div class="grid"><div class="card"><small>Current buddy</small><h3>${b?(S.streak>=3?b.n:'Anonymous buddy'):'None yet'}</h3>${b?`<div class="pct">${sc.pc}%</div><a class="btn sm" href="#chat">Open chat</a>`:'<a class="btn sm" href="#match">Find a buddy</a>'}</div>
<div class="card"><small>Personality</small><h3>${S.res!=null?T[S.res][0]:'Not taken'}</h3><a href="#quiz">${S.res!=null?'Retake':'Take quiz'}</a></div><div class="card"><small>Language</small><h3>${S.lang}</h3><small>${S.comm}</small></div>
<div class="card"><small>Connection progress</small><div class="bar"><i style="width:${Math.min(100,S.streak/5*100)}%"></i></div><p>${S.streak}/5 days · reveal at 3, rotation at 5</p></div></div>
<div class="card"><h3>Your interests</h3>${S.ints.length?chips(S.ints):'<a href="#interests">Add interests</a>'}</div><div class="card"><h3>Queue &amp; settings</h3><p>${b?'Matched, not waiting.':'Waiting queue: idle until you request matches.'} <a href="#prefs">Settings →</a></p></div>`},
shield:()=>`<h2>Threshold Shield</h2><div class="grid">${[['Report &amp; block','Available inside every chat, any time. Blocked students never match again.'],['Automated checks','Detects inappropriate content and spam, and sends warnings. It does not catch everything, so human review matters.'],['Human moderation','Reports go to trained moderators who review context and act: warn, restrict or remove.'],['Appeals','If you’re actioned, you can appeal and a different moderator reviews it.'],['Community guidelines','Be kind. No harassment, hate, sexual content, pressure for contact details, or impersonation.'],['Privacy','Anonymous first. You control visibility in Settings. Contact details are never shared.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`,
prefs:()=>`<h2>Settings</h2><div class="card"><form id="f"><label>Nickname</label><input id="nk" value="${esc(S.nick)}"><label>Preferred language</label><select id="lg">${LANGS.map(l=>`<option ${l==S.lang?'selected':''}>${l}</option>`)}</select><label>Communication preference</label><select id="cm">${COM.map(l=>`<option ${l==S.comm?'selected':''}>${l}</option>`)}</select><label><input type="checkbox" id="vi" ${S.vis?'checked':''}> Allow my basic profile to be revealed after 3 active days</label><button class="btn" style="margin-top:12px">Save</button> <a class="btn o" href="#interests">Update interests</a></form></div>
<div class="card"><h3>Blocked users</h3>${S.blocked.length?S.blocked.map(i=>`<span class="chip s">${P.find(p=>p.id==i).n} <a onclick="S.blocked=S.blocked.filter(x=>x!=${i});save();rt()">unblock</a></span>`).join(''):'<p>None.</p>'}</div>
<div class="card"><button class="btn o" onclick="rep()">Report an issue</button><button class="btn o" onclick="S.reg=false;save();go('home')">Log out</button><button class="btn o" onclick="if(confirm('Delete your account and local demo data?')){localStorage.removeItem('th');location.hash='home';location.reload()}">Delete account</button></div>`};
function nextQ(){if(qi==9){const c=[0,0,0,0];S.ans.forEach(a=>c[a]++);S.res=c.indexOf(Math.max(...c));qi=10;save()}else qi++;rt()}
function tg(x){S.ints=S.ints.includes(x)?S.ints.filter(i=>i!=x):[...S.ints,x];save();rt()}
function addI(){const v=$('#ci').value.trim();if(v&&!S.ints.includes(v))S.ints.push(v);save();rt()}
function pick(id){if(S.buddy)S.prev.push(S.buddy);S.buddy=id;S.msgs=[];S.streak=Math.max(S.streak,1);save();go('chat')}
function rot(){go('match')}
function day(){S.streak++;save();rt()}
function tr(a){const s=a.parentNode.querySelector('span'),o=a.textContent=='Show original';s.textContent=o?s.dataset.o:s.dataset.t;a.textContent=o?'Show translation':'Show original'}
function blk(id){if(confirm('Block this buddy? You won’t be matched again.')){S.blocked.push(id);S.buddy=null;save();go('match')}}
function rep(){const r=prompt('Describe the issue. A human moderator will review it (simulated).');if(r)alert('Thanks. Your report was sent to moderators (demo).')}
function rt(){const h=(location.hash||'#home').slice(1),r=V[h]?h:(h=='how'?'home':'home');
$('#nav').innerHTML=`<a class="logo" href="#home">threshold<b>.</b></a>`+NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==r?'on':''}">${n[1]}</a>`).join('');
$('#app').innerHTML=V[r]()+(r=='home'?'<footer>threshold. · Find your people, at your pace.<br>Prototype with simulated verification, matching pool and translation.</footer>':'');
const f=$('#f');if(f)f.onsubmit=e=>{e.preventDefault();
if(r=='register'){if($('#code').value.trim().toUpperCase()!='THRESH-2026'){$('#err').textContent='Invalid invitation code (demo code: THRESH-2026).';return}S.college='Northfield College';S.name=$('#nm').value;S.lang=$('#lg').value;S.reg=true;save();go('profile')}
else if(r=='profile'){S.nick=$('#nk').value;S.lang=$('#lg').value;S.comm=$('#cm').value;S.intro=$('#in').value;save();go('quiz')}
